<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trello Clone</title>
    <link rel="stylesheet" href="trello.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <h1 class="logo">Trello Clone</h1>

        <nav>
            <button class="add-list-btn">+ Add List</button>
        </nav>
    </header>

    <!-- Board -->
    <main class="board">

        <!-- To Do List -->
        <section class="list">

            <div class="list-header">
                <h2>To Do</h2>
            </div>

            <div class="cards">

                <article class="card">
                    <h3>Learn React</h3>
                </article>

                <article class="card">
                    <h3>Build Weather App</h3>
                </article>

            </div>

            <button class="add-card-btn">+ Add Card</button>

        </section>

        <!-- Doing List -->
        <section class="list">

            <div class="list-header">
                <h2>Doing</h2>
            </div>

            <div class="cards">

                <article class="card">
                    <h3>Create Trello Clone</h3>
                </article>

            </div>

            <button class="add-card-btn">+ Add Card</button>

        </section>

        <!-- Done List -->
        <section class="list">

            <div class="list-header">
                <h2>Done</h2>
            </div>

            <div class="cards">

                <article class="card">
                    <h3>Learn JavaScript</h3>
                </article>

                <article class="card">
                    <h3>Calculator Project</h3>
                </article>

            </div>

            <button class="add-card-btn">+ Add Card</button>

        </section>

    </main>

</body>
</html>
